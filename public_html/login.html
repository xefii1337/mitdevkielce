<!doctype html>
<html lang="pl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="">
    <title>Logowanie / Rejestracja</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500&display=swap" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/bootstrap-icons.css" rel="stylesheet">
    <link href="css/mit-dev.css" rel="stylesheet">
</head>

<body>
    <main>
        <section class="hero-section d-flex justify-content-center align-items-center" style="min-height: 100vh;">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-5 col-12">
                        <div class="custom-form text-center">

                            <!-- Login Form -->
                            <div id="login-container">
                                <h2 class="mb-4">Logowanie</h2>
                                <form id="login-form" role="form">
                                    <div class="form-floating mb-3">
                                        <input type="email" name="email" id="email" class="form-control"
                                            placeholder="name@example.com" required>
                                        <label for="email">Adres Email</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input type="password" name="password" id="password" class="form-control"
                                            placeholder="Hasło" required>
                                        <label for="password">Hasło</label>
                                    </div>

                                    <button type="submit" class="btn custom-btn mt-3" id="login-btn">Zaloguj
                                        się</button>

                                    <div id="login-message" class="mt-3 text-danger"></div>

                                    <div class="mt-4">
                                        <p>Nie masz konta? <a href="#" id="show-register"
                                                class="text-primary">Zarejestruj się</a></p>
                                    </div>
                                </form>
                            </div>

                            <!-- Register Form (Hidden by default) -->
                            <div id="register-container" class="d-none">
                                <h2 class="mb-4">Rejestracja</h2>
                                <form id="register-form" role="form">
                                    <div class="form-floating mb-3">
                                        <input type="email" name="reg-email" id="reg-email" class="form-control"
                                            placeholder="name@example.com" required>
                                        <label for="reg-email">Adres Email</label>
                                    </div>

                                    <div class="form-floating mb-3">
                                        <input type="password" name="reg-password" id="reg-password"
                                            class="form-control" placeholder="Hasło (min. 6 znaków)" required
                                            minlength="6">
                                        <label for="reg-password">Hasło</label>
                                    </div>

                                    <button type="submit" class="btn custom-btn mt-3" id="register-btn">Utwórz
                                        konto</button>

                                    <div id="register-message" class="mt-3 text-danger"></div>

                                    <div class="mt-4">
                                        <p>Masz już konto? <a href="#" id="show-login" class="text-primary">Zaloguj
                                                się</a></p>
                                    </div>
                                </form>
                            </div>

                            <div class="mt-4 border-top pt-3">
                                <a href="index.html" class="text-muted">Powrót do strony głównej</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="js/jquery.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script type="module" src="js/supabase-client.js"></script>
    <script type="module" src="js/mit-dev-auth.js"></script>
</body>

</html>
